<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Sistema de Pontos Mecamau</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animação de listras na barra, igual ao dashboard */
    @keyframes moveStripes {
      0% { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    .progress-animated {
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.2) 0,
        rgba(255,255,255,0.2) 10px,
        rgba(255,255,255,0.35) 10px,
        rgba(255,255,255,0.35) 20px
      );
      background-size: 40px 40px;
      animation: moveStripes 1.2s linear infinite;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .points-bar { background-color: #e5e7eb; border-radius: 9999px; height: 6px; margin: 8px 0; position: relative; overflow: hidden; }
    .points-fill { background: linear-gradient(90deg, #06b6d4, #0891b2); transition: width 0.5s ease, background 0.3s ease; height: 100%; border-radius: 9999px; }
    .status-ok { background-color: #d1fae5; color: #065f46; }
    .status-error { background-color: #fee2e2; color: #7f1d1d; }
    .btn { padding: 6px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background-color: #3b82f6; color: white; }
    .btn-primary:hover { background-color: #2563eb; }
    .btn-secondary { background-color: #f3f4f6; color: #374151; }
    .btn-secondary:hover { background-color: #e5e7eb; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn-danger:hover { background-color: #dc2626; }
    .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .input-field { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; margin-bottom: 8px; }
    .label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #374151; }
    @media (max-width: 640px) {
      .bulk-controls { display: flex; flex-direction: column; gap: 8px; }
      .bulk-controls > div { width: 100%; }
    }
    @media (min-width: 641px) {
      .bulk-controls { display: flex; gap: 12px; align-items: flex-end; }
      .bulk-controls > div { flex: 1; }
    }
    textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; font-family: inherit; }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    input[type="file"] { cursor: pointer; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header (mesmo estilo do dashboard) -->
<header class="bg-white border-b shadow-sm sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-2 sm:px-4 py-2 sm:py-3 flex flex-wrap items-center gap-2 sm:gap-3">
    <img src="/logos/mecamau_logo.png" alt="Mecamau" class="w-7 h-7 sm:w-8 sm:h-8 object-contain"/>
    <h1 class="text-base sm:text-lg font-bold">Sistema de Pontos Mecamau — Admin</h1>
    <div class="ml-auto w-full sm:w-auto flex flex-wrap items-center gap-2 justify-end overflow-x-auto">
      <button onclick="goBack()" class="px-2 sm:px-3 py-1.5 rounded bg-gray-100 hover:bg-gray-200 text-xs sm:text-sm whitespace-nowrap">Voltar</button>
      <a href="/regras" class="px-2 sm:px-3 py-1.5 rounded bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs sm:text-sm whitespace-nowrap">Regras</a>
      <a id="navMy" href="/dashboard" class="px-2 sm:px-3 py-1.5 rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs sm:text-sm whitespace-nowrap">Meu painel</a>
      <a id="navAdmin" href="/admin" class="px-2 sm:px-3 py-1.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs sm:text-sm whitespace-nowrap">Admin</a>
      <button onclick="logout()" class="px-2 sm:px-3 py-1.5 rounded bg-red-50 hover:bg-red-100 text-red-700 text-xs sm:text-sm whitespace-nowrap">Sair</button>
    </div>
  </div>
  <script>
    // Ajusta navegação conforme papel
    (async function(){
      try{
        const r = await fetch('/me');
        if(!r.ok) return;
        const me = await r.json();
        const navAdmin = document.getElementById('navAdmin');
        if (navAdmin) navAdmin.classList.toggle('hidden', !me.is_admin);
        const navMy = document.getElementById('navMy');
        if (navMy) navMy.classList.toggle('hidden', !!me.is_admin);
      }catch(_){/* ignore */}
    })();
  </script>
</header>

<main class="max-w-4xl mx-auto p-4 pb-8">

  <!-- Status Banner -->
  <div id="statusBanner" class="hidden px-3 py-2 text-sm rounded mb-3"></div>

  <!-- Criar Funcionário -->
  <div class="card">
    <h2 class="font-bold mb-3 text-lg text-gray-800">Criar Funcionário</h2>
    <input type="text" id="nome" class="input-field" placeholder="Nome">
    <input type="text" id="login" class="input-field" placeholder="Login">
    <input type="password" id="senha" class="input-field" placeholder="Senha">
    <label class="label">Foto (opcional)</label>
    <input type="file" id="foto" class="input-field">
    <button class="btn btn-primary" onclick="criarUser()">Criar Funcionário</button>
  </div>

  <!-- Criar Admin -->
  <div class="card">
    <h2 class="font-bold mb-3 text-lg text-gray-800">Criar Novo Admin</h2>
    <input type="text" id="adminNome" class="input-field" placeholder="Nome do admin">
    <input type="text" id="adminLogin" class="input-field" placeholder="Login">
    <input type="password" id="adminSenha" class="input-field" placeholder="Senha">
    <button class="btn btn-primary" onclick="criarAdmin()">Criar Admin</button>
  </div>

  <!-- Ações em Massa -->
  <div class="card">
    <h2 class="font-bold mb-3 text-lg text-gray-800">Ações em Massa</h2>
    
    <!-- Novo Ciclo -->
    <div class="mb-4">
      <h3 class="font-semibold mb-2 text-gray-700">Novo Ciclo (Reset para X pontos)</h3>
      <div class="bulk-controls">
        <div>
          <label class="label">Valor</label>
          <input type="number" id="resetValor" class="input-field" placeholder="Ex: 50" min="0" max="100" value="50">
        </div>
        <div>
          <label class="label">Motivo (obrigatório)</label>
          <input type="text" id="resetMotivo" class="input-field" placeholder="Ex: Ciclo mensal">
        </div>
        <button class="btn btn-primary" onclick="resetAll()" style="padding: 8px 16px; align-self: flex-end;">Aplicar Ciclo</button>
      </div>
    </div>

    <!-- Adicionar/Subtrair -->
    <div>
      <h3 class="font-semibold mb-2 text-gray-700">Adicionar/Subtrair para Todos</h3>
      <div class="bulk-controls">
        <div>
          <label class="label">Delta (+ ou -)</label>
          <input type="number" id="bulkDelta" class="input-field" placeholder="Ex: +5 ou -3" value="0">
        </div>
        <div>
          <label class="label">Motivo (obrigatório)</label>
          <input type="text" id="bulkMotivo" class="input-field" placeholder="Ex: Bônus extra">
        </div>
        <button class="btn btn-primary" onclick="bulkAdd()" style="padding: 8px 16px; align-self: flex-end;">Aplicar Ajuste</button>
      </div>
    </div>
  </div>

  <!-- Mensagem de resultado -->
  <div id="msg" class="mt-3 text-center text-sm"></div>

  <!-- Funcionários -->
  <div class="mt-8">
    <h2 class="font-bold mb-4 text-lg text-gray-800">Funcionários</h2>
    <div class="mb-3">
      <input type="text" id="search" class="input-field" placeholder="🔍 Buscar por nome..." onkeyup="aplicarFiltro()">
    </div>
    <div id="lista" class="space-y-2">
      <div class="text-gray-500 text-center py-4">Carregando...</div>
    </div>
  </div>

  <!-- Administradores -->
  <div class="mt-8">
    <div id="adminsLista" class="space-y-2">
      <div class="text-gray-500 text-center py-4">Carregando...</div>
    </div>
  </div>

</main>

<!-- Scripts -->
<script>
  // Helper functions for HTML (loaded before admin.js)
  function goBack() {
    if (history.length > 1) history.back();
    else window.location.href = '/';
  }

  async function logout() {
    try {
      await fetch('/logout', { method: 'POST' });
    } catch (_) {}
    window.location.href = '/';
  }

  // Status helpers (called from admin.js)
  function showStatus(msg, type = 'error') {
    const el = document.getElementById('statusBanner');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'px-3 py-2 text-sm rounded mb-3 ' + (type === 'ok' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700');
    el.classList.remove('hidden');
  }
  function hideStatus() {
    const el = document.getElementById('statusBanner');
    if (el) el.classList.add('hidden');
  }
</script>

<!-- External admin app logic -->
<script src="/js/admin.js"></script>

</body>
</html>
